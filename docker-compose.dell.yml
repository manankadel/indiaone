services:
  food-suraksha:
    build: .
    image: food-suraksha:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FOOD_DATABASE_URL: ${FOOD_DATABASE_URL}
      FOOD_DATABASE_SSL: "false"
      FOOD_DATABASE_POOL_MAX: "10"
      FOOD_AUTHORITY_API_KEY: ${FOOD_AUTHORITY_API_KEY}
      AUTHORITY_SESSION_SECRET: ${AUTHORITY_SESSION_SECRET}
      BLUEBLOOD_ID_ISSUER: ${BLUEBLOOD_ID_ISSUER:-https://id.bluebloodstudio.com}
      BLUEBLOOD_ID_JWT_AUDIENCE: ${BLUEBLOOD_ID_JWT_AUDIENCE:-food-suraksha}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY}
      FOOD_AI_PROVIDER: ${FOOD_AI_PROVIDER:-groq}
      FOOD_AI_MODEL: ${FOOD_AI_MODEL:-qwen/qwen3.6-27b}
      EVIDENCE_STORAGE_PATH: /var/lib/food-suraksha/evidence
    ports:
      - "127.0.0.1:3020:3000"
    networks:
      - blueblood_internal
    volumes:
      - /opt/food-suraksha/data/evidence:/var/lib/food-suraksha/evidence

networks:
  blueblood_internal:
    external: true
